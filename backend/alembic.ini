# Alembic configuration for detectmap.
#
# Two named environments live in this file:
#   [public]   — public-schema migrations (mssp_orgs, customers, users, ...)
#   [customer] — per-tenant schema migrations (detections, coverage, ...)
#
# Usage:
#   alembic -n public  upgrade head
#   DETECTMAP_TARGET_SCHEMA=cust_acme alembic -n customer upgrade head

[alembic]
# Default section is unused; everything runs via -n.
script_location = migrations/public

[public]
script_location = migrations/public
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = ${DATABASE_URL_SYNC}

[customer]
script_location = migrations/customer
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = ${DATABASE_URL_SYNC}

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
