[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# Tests that wipe + reseed reference tables (attack/sector/GRC) are
# destructive on the shared dev DB. Mark them `wipes_db`; default
# `pytest -q` excludes them so devs running tests locally don't lose
# their seeded catalog. Run them explicitly with `pytest -m wipes_db`
# (paired with re-seeding after).
markers =
    wipes_db: destructive — wipes ATT&CK/sector/GRC tables before and after
    matcher: pure Sigma matcher unit tests (no DB)
addopts = -m "not wipes_db"


